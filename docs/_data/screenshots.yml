# Each entry needs an image at docs/assets/img/screenshots/<file>, plus an
# English and a Portuguese caption. The screenshots.md pages (en/pt) loop over
# this list, so adding a new screenshot never touches the gallery markup.
- file: lobby.png
  caption_en: "The Lobby, the activity's home screen: the progress to resume, the PuzzleCoin balance, the difficulty, the minimum-questions notice and Play (or the practice Demo), with buttons for the Shop, the Ranking and Settings"
  caption_pt: "O Lobby, a tela inicial da atividade: o progresso a retomar, o saldo de PuzzleCoin, a dificuldade, o aviso de mínimo de questões e Jogar (ou a Demo de prática), com botões para a Loja, o Ranking e as Configurações"
- file: shop.png
  caption_en: "The Loadout Shop: the student spends PuzzleCoin on Potions, Shields, Quick Magic, Swords and Question Hints before the match, and sees how many of each they own"
  caption_pt: "A Loja de Loadout: o estudante gasta PuzzleCoin em Poções, Escudos, Magias Rápidas, Espadas e Dicas antes da partida, e vê quantos de cada ele tem"
- file: ranking.png
  caption_en: "The class ranking, with the student's own row highlighted — on its own 100-point scale, independent of the grade"
  caption_pt: "O ranking da turma, com a linha do próprio estudante destacada — numa escala própria de 100 pontos, independente da nota"
- file: gameplay.jpg
  caption_en: "Combat in progress: the 8×8 Match-3 board, both sides' HP, meters and counters, the consumables in the side panels, the history of moves and the progress indicator (Level 3, Phase 4)"
  caption_pt: "Combate em andamento: o tabuleiro Match-3 8×8, o HP, os medidores e contadores dos dois lados, os consumíveis nos painéis laterais, o histórico de jogadas e o indicador de progresso (Nível 3, Fase 4)"
- file: question-dialog.jpg
  caption_en: "The question challenge as a native HTML dialog — centered, focus-managed, with Skip, a Hint from the loadout and Attack"
  caption_pt: "O desafio de pergunta como um diálogo HTML nativo — centralizado, com gerenciamento de foco, com Pular, uma Dica do loadout e Atacar"
- file: settings-form.png
  caption_en: "Teacher-facing activity settings: game mode, opponent, HP and damage, coin gain, minimum questions, attempts, ranking and hints"
  caption_pt: "Configurações da atividade para o professor: modo de jogo, oponente, HP e dano, ganho de moeda, mínimo de questões, tentativas, ranking e dicas"
- file: manage-questions.png
  caption_en: "Manage questions: import from the Question Bank, add by hand or generate with AI, with each question's source, status and how often it was drawn"
  caption_pt: "Gerenciar questões: importar do Banco de Questões, adicionar à mão ou gerar com IA, com a origem, o status e a frequência de sorteio de cada questão"
- file: report.png
  caption_en: "The teacher report: completion rate, score distribution, per-student progress and the most missed questions"
  caption_pt: "O relatório do professor: taxa de conclusão, distribuição das notas, progresso por estudante e as questões mais erradas"
